<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS OS - Login</title>

    <link rel="icon" type="image/png" href="JARVIS OS.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f4f7fc; /* Fondo claro limpio */
            overflow: hidden;
            position: relative;
        }

        /* Fondo dinámico con orbes azules suaves estilo Windows Light */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 80% 20%, #e0f2fe 0%, transparent 50%),
                        radial-gradient(circle at 20% 80%, #dbeafe 0%, transparent 50%);
            filter: blur(60px);
            z-index: -1;
        }

        /* Contenedor Glassmorphic Claro */
        .login-container {
            position: relative;
            width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            text-align: center;
            transition: transform 0.3s ease, border 0.3s ease;
        }

        .login-container:hover {
            border: 1px solid rgba(0, 114, 255, 0.25);
        }

        /* Cabecera alineada horizontalmente */
        .brand-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; 
            margin-bottom: 8px;
        }

        /* Contenedor para recortar el halo blanco del mini logo */
        .mini-logo-wrapper {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0072ff;
            box-shadow: 0 0 12px rgba(0, 114, 255, 0.2);
        }

        .mini-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.28);
        }

        .brand-header h1 {
            color: #1e3a8a; /* Azul corporativo profundo */
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .logo p {
            color: #64748b;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Campos de Entrada Estilizados */
        .input-box {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.1rem;
        }

        .input-box input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            outline: none;
            color: #1e293b;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            background: #fff;
            border-color: #0072ff;
            box-shadow: 0 0 10px rgba(0, 114, 255, 0.15);
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .remember {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 25px;
            color: #475569;
            font-size: 0.85rem;
        }

        .remember input {
            margin-right: 8px;
            accent-color: #0072ff;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0052d4 0%, #0072ff 50%, #00f2fe 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.3);
        }

        #mensajeError {
            font-size: 0.85rem;
            margin-top: 15px;
            min-height: 20px;
            font-weight: 500;
        }

        .version {
            position: absolute;
            bottom: 20px;
            color: #94a3b8;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="login-container">
        <div class="logo">
            <div class="brand-header">
                <div class="mini-logo-wrapper">
                    <img src="JARVIS OS.png" alt="JARVIS OS" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2103/2103633.png';">
                </div>
                <h1>JARVIS OS</h1>
            </div>
            <p>Identifícate</p>
        </div>

        <form id="loginForm">
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="usuario" placeholder="Usuario" autocomplete="off" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>

            <div class="remember">
                <label>
                    <input type="checkbox"> Recordarme
                </label>
            </div>

            <button type="submit">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
            </button>

            <p id="mensajeError"></p>
        </form>
    </div>

    <div class="version">
        JARVIS OS v1.0
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const usuarioInput = document.getElementById('usuario').value.trim();
            const passwordInput = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensajeError');

            const USUARIO_VALIDO = "Lazaropuri";
            const PASSWORD_VALIDO = "L@zaro0697";

            if (usuarioInput === USUARIO_VALIDO && passwordInput === PASSWORD_VALIDO) {
                mensajeError.style.color = "#059669";
                mensajeError.innerHTML = '<i class="fa-solid fa-circle-check"></i> Acceso concedido. Iniciando JARVIS OS...';
                
                setTimeout(() => {
                    window.location.href = "dashboard.html"; 
                }, 1000);

            } else {
                mensajeError.style.color = "#dc2626";
                if (usuarioInput !== USUARIO_VALIDO) {
                    mensajeError.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> El usuario ingresado no existe.';
                } else {
                    mensajeError.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Contraseña incorrecta. Inténtalo de nuevo.';
                }
            }
        });
    </script>
</body>
</html>
